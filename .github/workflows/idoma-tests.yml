name: IDOMA tests

on:
  push:
    branches: [idoma-integrated]
  pull_request:
    branches: [idoma-integrated]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IDOMA_2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: IDOMA_2.0/requirements-v2.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-v2.txt
      - name: Compile Python sources
        run: python -m compileall -q idoma_v2 tests
      - name: Run unit tests
        env:
          IDOMA_API_TOKEN: ci-test-token
        run: python -m unittest discover -s tests -v
      - name: Check web JavaScript syntax
        run: node --check idoma_v2/web/app.js
